name: Tuya

services:
   database_symfony:
      container_name: tuya-db
      image: mariadb:latest
      volumes:
         - database:/var/lib/mysql
      environment:
         MYSQL_DATABASE: faubert
         MYSQL_USER: symfony
         MYSQL_PASSWORD: symfony
         MYSQL_ROOT_PASSWORD: secret
      command: --default-authentication-plugin=mysql_native_password
      ports:
         - 3304:3306
   phpmyadmin:
      container_name: tuya-pma
      image: phpmyadmin/phpmyadmin:latest
      ports:
         - 8075:80
      environment:
         PMA_HOST: database_symfony
   php:
      container_name: tuya-php
      build:
         context: docker
      ports:
         - 9005:9000
      volumes:
         - ./app:/var/www/faubert
      depends_on:
         - database_symfony
   nginx:
      container_name: tuya-app
      image: nginx:stable-alpine
      ports:
         - 8076:80
      volumes:
         - ./app:/var/www/faubert
         - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      depends_on:
         - php
         - database_symfony
volumes:
   database: {}
